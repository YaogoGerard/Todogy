name: Deploy

on:
  push:
    branches: [deploy]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yaogogerard/todogy/backend

jobs:
  test:
    name: Tests (backend + frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Backend — install
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend — typecheck / build
        run: npm ci && npm run build
        working-directory: backend

      - name: Backend — tests
        run: npm test
        working-directory: backend

      - name: Frontend — install
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — typecheck / build
        run: npm ci && npm run build
        working-directory: frontend
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Frontend — unit tests
        run: npm test
        working-directory: frontend

      - name: Frontend — E2E tests (Playwright)
        run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend

  backend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Render deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  frontend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --project "$FIREBASE_PROJECT_ID"
        working-directory: frontend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
